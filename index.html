ody:`礼物还没到时间。时间到了,树下会自己多个盒子。`,ok:`好`,cancel:`知道了`},importOverwrite:{title:`覆盖当前进度?`,body:`导入后,现在的存档会被替换。`,ok:`覆盖`,cancel:`算了`},sell:{title:`卖掉它?`,body:`卖掉退回一部分库存。这一个就没了。`,ok:`卖`,cancel:`留着`}},qf={saved:`已存档。`,saveFail:`存档失败。浏览器说空间不够。`,newDay:`新的一天。树换了片叶子。`,tierUp:`升档了:{name}。`,orderDone:`订单完成。`,orderMiss:`订单过期了。没关系。`,rottenCleared:`清掉了一个烂苹果。`,wormHealed:`虫眼治好了。`,pinned:`钉住了。`,unpinned:`取消钉住。`,offered:`献出一批苹果,买东西便宜了。`,poisonDropped:`毒苹果,点掉了。`,eggFound:`发现一个彩蛋:{name}。`,maxed:`到顶了。再多就装不下了。`,tooFast:`手慢点,树在看你。`,offlineBack:`回来啦。`},Jf=[{id:`fuji`,name:`富士红`,nickname:`老实人`,desc:`最常见,最靠谱,永远在场。`,lore:`富士苹果由日本育成,名字据说来自育成地藤崎,常被误认成富士山。`,hint:`树下最先掉的那种。`},{id:`goldenDel`,name:`黄元帅`,nickname:`金黄打工人`,desc:`黄里透绿,甜里带面。`,lore:`20 世纪初发现于美国西弗吉尼亚的一棵偶然实生树,后来哪儿的果园都有它。`,hint:`黄黄的,不是金的。`},{id:`granny`,name:`青苹果`,nickname:`酸脸先生`,desc:`酸得很诚实,订单特别爱点它。`,lore:`以澳大利亚的史密斯奶奶命名,她 19 世纪 60 年代在院子里发现了它。`,hint:`还没熟?不,它就这样。`},{id:`delicious`,name:`蛇果`,nickname:`红衣大侠`,desc:`深红,发亮,不太笑。`,lore:`名字里没有蛇。据说是英文 Delicious 的音译,和伊甸园没有关系。`,hint:`树长大之后才见得到。`},{id:`pinkLady`,name:`粉红佳人`,nickname:`爱美的人`,desc:`粉里带红,脆,爱自拍。`,lore:`澳大利亚育成,学名 Cripps Pink,晚熟,要等一个很长的夏天。`,hint:`像是把晚霞摘下来了。`},{id:`redStreak`,name:`红斑`,nickname:`条纹运动员`,desc:`红色条纹,跑得很快的样子。`,lore:`有些苹果披着红条纹,像被日出划了几笔。行话叫"条红"。`,hint:`山上的苹果,穿着运动服。`},{id:`caramel`,name:`焦糖`,nickname:`糖心不糖`,desc:`咬下去,有一圈蜜。`,lore:`果肉里糖分多的苹果会透出半透明的"水心",行话叫蜜病,其实没坏。`,hint:`切开才知道。`},{id:`purple`,name:`紫玉`,nickname:`深紫低调`,desc:`紫得很深,话很少。`,lore:`紫色来自花青素,和蓝莓、紫甘蓝是一家人。`,hint:`树冠入云之后才有。`},{id:`silver`,name:`灰银`,nickname:`月光色`,desc:`灰银灰银的,像加了滤镜。`,lore:`没有人说得清它哪来的。看夜班的人说,月亮好的晚上见过。`,hint:`天上才有的颜色。`},{id:`worm`,name:`虫蛀`,nickname:`到此一游`,desc:`有个洞,有个故事。`,lore:`每一只虫眼,都是一次未经批准的品尝。点一下,洞就愈合了。`,hint:`不是每个苹果都完好。`},{id:`giant`,name:`巨无霸`,nickname:`占三格`,desc:`大得不讲道理,一个顶五个。`,lore:`吉尼斯纪录里最重的苹果约 1.8 公斤,出自日本。这个更大,因为这是游戏。`,hint:`小心,它在往你这边滚。`},{id:`golden`,name:`金苹果`,nickname:`三位女神吵起来了`,desc:`一闪一闪,据说值一座金山。`,lore:`神话里,刻着"献给最美者"的金苹果引来了三位女神,后来又引来了特洛伊战争。`,hint:`金光一闪,别眨眼。`},{id:`forbidden`,name:`禁果`,nickname:`树顶那个`,desc 了。老徐说:才十分之一。`,speaker:`laoxu`},{id:`nr-m10-2`,trigger:`milestone`,pct:10,text:`八亿多个苹果上路了。树没说话。`},{id:`nr-m10-3`,trigger:`milestone`,pct:10,text:`圣诞老人来电:腰好了一点点。`,speaker:`santa`},{id:`nr-m25-1`,trigger:`milestone`,pct:25,text:`四分之一。日历看了你一眼。`},{id:`nr-m25-2`,trigger:`milestone`,pct:25,text:`老徐开始数数,数到一半放弃了。`,speaker:`laoxu`},{id:`nr-m25-3`,trigger:`milestone`,pct:25,text:`你的手臂,有了自己的想法。`},{id:`nr-m50-1`,trigger:`milestone`,pct:50,text:`一半了。日历开始着急。`},{id:`nr-m50-2`,trigger:`milestone`,pct:50,text:`四十一亿。老海说他数过了。`,speaker:`laohai`},{id:`nr-m50-3`,trigger:`milestone`,pct:50,text:`圣诞老人:一半了!我腰好多了。`,speaker:`santa`},{id:`nr-m75-1`,trigger:`milestone`,pct:75,text:`还剩四分之一。日历在加速。`},{id:`nr-m75-2`,trigger:`milestone`,pct:75,text:`雪橇装了一半,还能再装。`,speaker:`santa`},{id:`nr-m75-3`,trigger:`milestone`,pct:75,text:`老徐:别回头看。回头看会累。`,speaker:`laoxu`},{id:`nr-m90-1`,trigger:`milestone`,pct:90,text:`只剩一成了。圣诞老人开始紧张。`,speaker:`santa`},{id:`nr-m90-2`,trigger:`milestone`,pct:90,text:`老徐搬来第二条凳子,不为谁。`,speaker:`laoxu`},{id:`nr-m90-3`,trigger:`milestone`,pct:90,text:`树小声说:要不,我也帮你摇?`},{id:`nr-m99-1`,trigger:`milestone`,pct:99,text:`差一点点。风也屏住了呼吸。`},{id:`nr-m99-2`,trigger:`milestone`,pct:99,text:`最后的百分之一,最长。`},{id:`nr-m99-3`,trigger:`milestone`,pct:99,text:`老徐:别抖。你一抖,树也抖。`,speaker:`laoxu`},{id:`nr-m100-1`,trigger:`milestone`,pct:100,text:`最后一个苹果送到了。电话那头:收到,雪橇装得下。`,speaker:`santa`},{id:`nr-m100-2`,trigger:`milestone`,pct:100,text:`树下多了一个盒子。盒子上写着:圣诞节再拆。`},{id:`nr-m100-3`,trigger:`milestone`,pct:100,text:`老徐摸摸树干:歇会儿吧。`,speaker:`laoxu`},{id:`nr-a10-1`,trigger:`idle-return`,awayMin:10,text:`你回来了。苹果没等你,继续送。`},{id:`nr-a10-2`,trigger:`idle-return`,awayMin:10,text:`树说:你刚走,我就想你了。`},{id:`nr-a60-1`,trigger:`idle-return`,awayMin:60,speaker:`laoxu`,text:`回来啦?我替你看着了。`},{id:`nr-a60-2`,trigger:`idle-return`,awayMin:60,text:`车队没停。乌鸦也没停。`},{id:`nr-a480-1`,trigger:`idle-return`,awayMin:480,text:`你走了很久。树说,它也想歇。`},{id:`nr-a480-2`,trigger:`idle-return`,awayMin:480,speaker:`laoxu`,text:`我就眯了一下。苹果自己长的。`},{id:`nr-a1440-1`,trigger <body>
<header id="topbar">
  <div id="hand" class="hand" role="group" aria-label="手上的苹果">
    <canvas id="handIcon" aria-hidden="true"></canvas>
    <div class="hv"><b id="handNum">0</b><span id="handRate"></span></div>
    <div id="handBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="攒够下一件东西的进度"><i></i></div>
    <span id="handGoal"></span>
  </div>
  <div class="counts"><span class="lbl">已送出</span><b id="apples">0</b><span id="goalNum">/ 82亿</span></div>
  <button id="btnSettings" class="ib" type="button" aria-label="设置">⚙</button>
  <div id="goalWrap" role="progressbar" aria-label="送达进度" aria-valuemin="0" aria-valuemax="100"><i id="goalBar"></i></div>
</header>

<div id="news" role="status" aria-live="off" aria-label="苹果日报"><span id="newsMast">苹果日报</span><div id="newsView"><span id="newsText"></span></div></div>

<main id="scene"><canvas id="stage" aria-label="苹果传送线"></canvas><div id="toast" role="status" aria-live="polite"></div><button id="btnHelper" type="button" hidden></button></main>

<footer id="bar">
  <section class="side" id="srcSide" aria-label="生产线">
    <button id="btnSrcBuy" class="act" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
    <button id="btnSrcUp" class="act up" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
  </section>
  <section class="side" id="rtSide" aria-label="运输线">
    <button id="btnRtBuy" class="act" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
    <button id="btnRtUp" class="act up" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
  </section>
</footer>


<div id="branchPick" hidden role="dialog" aria-label="选择分支">
  <div class="bp-box">
    <div class="bp-head"><b id="branchTitle">升级</b><span id="branchSub"></span></div>
    <div class="bp-cards">
      <button id="branch0" class="bcard" type="button" data-branch="0"><b class="nm"></b><span class="desc"></span><span class="pr"></span></button>
      <button id="branch1" class="bcard" type="button" data-branch="1"><b class="nm"></b><span class="desc"></span><span class="pr"></span></button>
    </div>
    <button id="branchCancel" class="plain" type="button">再想想</button>
  </div>
</div>

<div id="settings" hidden role="dialog" aria-label="设置">
  <div class="sheet">
    <h2>设置</h2>
    <div class="btns">
      <button id="btnTheme" type="button">主题:自动</button>
      <button id="btnSound" type="button">声音</button>
      <button id="btnMotion" type="button" hidden>摇一摇:关</button>
      <button id="btnExport" type="button">导出存档</button>
      <button id="btnImport" type="button">导入存档</button>
      <button id="btnReset" type="button">重新开始</button>
    </div>
    <p id="soundNote" class="note">静音拨片开着时声音会消失;iPhone 请先关掉侧边静音。</p>
    <p id="installNote" class="note">换手机或清缓存前,先「导出存档」;「添加到主屏幕」后可以像 App 一样打开。</p>
    <div id="exactApples"></div>
    <div id="saveWarn"></div>
    <div id="debug"></div>
    <div class="foot">原创小游戏,与苹果公司无关。</div>
    <button class="close" id="btnCloseSettings" type="button">关闭</button>
  </div>
</div>

<script>
// 仅处理:设置抽屉开关、关卡/分支弹层的关闭(点空白/Esc)。不依赖 main.ts。
(function(){
  var $=function(i){return document.getElementById(i)};
  var s=$('settings'),bp=$('branchPick');
  function closeAll(){s.hidden=true;bp.hidden=true}
  $('btnCloseSettings').addEventListener('click',function(){s.hidden=true});
  $('branchCancel').addEventListener('click',function(){bp.hidden=true});
  s.addEventListener('pointerdown',function(e){if(e.target===s)s.hidden=true});
  bp.addEventListener('pointerdown',function(e){if(e.target===bp)bp.hidden=true});
  addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
})();
</script>
</body>
</html>
