<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E🎅%3C/text%3E%3C/svg%3E" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1b1626" />
<title>圣诞帽帽 · Demo</title>
<style>
  html,body{margin:0;height:100%;background:#1b1626;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;width:100%}
  #game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  canvas{image-rendering:pixelated;display:block;touch-action:none}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:#1b1626;color:#ffe9b0;
    flex-direction:column;align-items:center;justify-content:center;font:600 20px/1.6 system-ui,sans-serif;text-align:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #rotate i{font-style:normal;font-size:56px;display:block;animation:rot 2.4s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  /* 触屏设备竖屏时提示横屏（桌面窄窗口不提示） */
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><i>📱</i>请横屏游玩<br><small style="opacity:.7;font-weight:400">Please rotate your device</small></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
