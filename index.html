<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#f4f1ea" />
<title>Shake the Apple</title>
<style>html,body{height:100vh}</style>
<link rel="stylesheet" href="/src/ui/ui.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="摇苹果" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script>if(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark')</script>
</head>
<body>
<header id="topbar">
  <div id="hand" class="hand" role="group" aria-label="手上的苹果">
    <canvas id="handIcon" aria-hidden="true"></canvas>
    <div class="hv"><b id="handNum">0</b><span id="handRate"></span></div>
    <div id="handBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="攒够下一件东西的进度"><i></i></div>
    <span id="handGoal"></span>
  </div>
  <div class="counts"><span class="lbl">已送出</span><b id="apples">0</b><span id="goalNum">/ 82亿</span></div>
  <button id="btnSettings" class="ib" type="button" aria-label="设置">⚙</button>
  <div id="goalWrap" role="progressbar" aria-label="送达进度" aria-valuemin="0" aria-valuemax="100"><i id="goalBar"></i></div>
</header>

<div id="news" role="status" aria-live="off" aria-label="苹果日报"><span id="newsMast">苹果日报</span><div id="newsView"><span id="newsText"></span></div></div>

<main id="scene"><canvas id="stage" aria-label="苹果传送线"></canvas><div id="toast" role="status" aria-live="polite"></div><button id="btnHelper" type="button" hidden></button></main>

<footer id="bar">
  <section class="side" id="srcSide" aria-label="生产线">
    <button id="btnSrcBuy" class="act" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
    <button id="btnSrcUp" class="act up" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
  </section>
  <section class="side" id="rtSide" aria-label="运输线">
    <button id="btnRtBuy" class="act" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
    <button id="btnRtUp" class="act up" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
  </section>
</footer>


<div id="branchPick" hidden role="dialog" aria-label="选择分支">
  <div class="bp-box">
    <div class="bp-head"><b id="branchTitle">升级</b><span id="branchSub"></span></div>
    <div class="bp-cards">
      <button id="branch0" class="bcard" type="button" data-branch="0"><b class="nm"></b><span class="desc"></span><span class="pr"></span></button>
      <button id="branch1" class="bcard" type="button" data-branch="1"><b class="nm"></b><span class="desc"></span><span class="pr"></span></button>
    </div>
    <button id="branchCancel" class="plain" type="button">再想想</button>
  </div>
</div>

<div id="settings" hidden role="dialog" aria-label="设置">
  <div class="sheet">
    <h2>设置</h2>
    <div class="btns">
      <button id="btnTheme" type="button">主题:自动</button>
      <button id="btnSound" type="button">声音</button>
      <button id="btnMotion" type="button" hidden>摇一摇:关</button>
      <button id="btnExport" type="button">导出存档</button>
      <button id="btnImport" type="button">导入存档</button>
      <button id="btnReset" type="button">重新开始</button>
    </div>
    <p id="soundNote" class="note">静音拨片开着时声音会消失;iPhone 请先关掉侧边静音。</p>
    <p id="installNote" class="note">换手机或清缓存前,先「导出存档」;「添加到主屏幕」后可以像 App 一样打开。</p>
    <div id="exactApples"></div>
    <div id="saveWarn"></div>
    <div id="debug"></div>
    <div class="foot">原创小游戏,与苹果公司无关。</div>
    <button class="close" id="btnCloseSettings" type="button">关闭</button>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
<script>
// 仅处理:设置抽屉开关、关卡/分支弹层的关闭(点空白/Esc)。不依赖 main.ts。
(function(){
  var $=function(i){return document.getElementById(i)};
  var s=$('settings'),bp=$('branchPick');
  function closeAll(){s.hidden=true;bp.hidden=true}
  $('btnCloseSettings').addEventListener('click',function(){s.hidden=true});
  $('branchCancel').addEventListener('click',function(){bp.hidden=true});
  s.addEventListener('pointerdown',function(e){if(e.target===s)s.hidden=true});
  bp.addEventListener('pointerdown',function(e){if(e.target===bp)bp.hidden=true});
  addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
})();
</script>
</body>
</html>
