<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>素问语料阅读器</title>
<meta name="description" content="素问语料阅读器：3848 条论断、3651 条「反对」，可按领域与年份检索，另附提问清单。">
<meta property="og:title" content="素问语料阅读器">
<meta property="og:description" content="3848 条论断、3651 条「反对」，按领域与年份检索，另附提问清单。">
<!-- Not indexed on purpose. robots.txt deliberately leaves this page crawlable
     so compliant bots can read this line; blocking it there instead would let
     the bare URL linger in results with no way to signal noindex. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<!-- Before first paint: reading the saved theme in app.js (end of body) meant
     dark-mode readers got a light flash on every load. Wrapped because reading
     localStorage throws outright in some privacy modes. -->
<script>
  try {
    document.documentElement.dataset.theme =
      localStorage.getItem('sooon.theme') ??
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch {}
</script>
<!-- Inline favicon: avoids a 404 when served from a bare static server. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238a5a2b'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'>素</text></svg>">
<!-- ?v= is the cache buster. GitHub Pages serves every file with max-age=600 and
     gives no way to set headers, so a reader can otherwise keep a stale app.js
     next to a fresh index.json (or the reverse) and the page just breaks. Bump
     these three together on every release; app.js reuses the same ?v= for the
     JSON it fetches, so this is the only place the version is written. -->
<link rel="stylesheet" href="style.css?v=1.4">
<!-- Starts the index fetch during head parsing instead of waiting for app.js.
     The URL has to match app.js's fetch exactly, ?v= included, or the preload
     is wasted and the file is requested twice. -->
<link rel="preload" href="index.json?v=1.4" as="fetch" type="application/json" crossorigin="anonymous">
</head>
<body>

<!-- One sticky container for both rows: the toolbar used to sticky at a
     hardcoded top offset, which broke every time the tab row changed height. -->
<div class="sticky-head" id="stickyHead">
  <header class="topbar">
    <div class="brand">
      <h1>素问语料</h1>
      <span class="muted" id="countLabel">加载中…</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="theses">论断</button>
      <button class="tab" data-view="checklist">提问清单</button>
    </nav>
    <button id="themeBtn" class="ghost" title="切换深色/浅色">◐</button>
  </header>

  <div class="toolbar" id="toolbar" role="search">
    <div class="toolbar-main">
      <input type="search" id="search" aria-label="搜索问题、论断、标题" placeholder="搜索问题、论断、标题…" autocomplete="off">
      <!-- Stays out of the collapsible row: the hit count is the one number
           worth seeing while typing, on any screen width. -->
      <span class="muted" id="resultLabel"></span>
      <!-- Only shown on narrow screens; on wide ones the filter row is always open. -->
      <button type="button" id="filterBtn" class="ghost wide" aria-expanded="false" aria-controls="filters">筛选</button>
    </div>
    <div class="filters" id="filters">
      <select id="domain" aria-label="按领域筛选"><option value="">全部领域</option></select>
      <select id="year" aria-label="按年份筛选"><option value="">全部年份</option></select>
      <select id="sort" aria-label="排序方式">
        <option value="date-desc">最新优先</option>
        <option value="date-asc">最早优先</option>
        <option value="len-desc">最长优先</option>
        <option value="len-asc">最短优先</option>
      </select>
      <label class="chk"><input type="checkbox" id="onlyRejects"> 只看有「反对」的</label>
    </div>
  </div>
</div>

<main id="main">
  <section id="view-list" class="view">
    <div id="list" class="list"><div class="loading">正在加载语料…</div></div>
    <div id="sentinel" class="sentinel"></div>
  </section>

  <section id="view-checklist" class="view hidden">
    <div id="checklist" class="checklist"></div>
  </section>
</main>

<!-- aria-live is deliberately absent: on the whole panel it made screen readers
     re-read the entire article every time the body finished loading. -->
<aside id="panel" class="panel hidden" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1">
  <div class="panel-head">
    <button class="panel-back" id="panelClose" aria-label="返回" title="返回 (Esc)"></button>
    <div class="panel-head-meta" id="panelHeadMeta"></div>
  </div>
  <div class="panel-inner" id="panelBody"></div>
</aside>
<div id="scrim" class="scrim hidden"></div>

<script src="app.js?v=1.4"></script>
</body>
</html>
