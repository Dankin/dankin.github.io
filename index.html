<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E🎅%3C/text%3E%3C/svg%3E" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1b1626" />
<title>圣诞帽帽 · Demo</title>
<style>
  html,body{margin:0;height:100%;background:#1b1626;overflow:hidden;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;width:100%}
  #game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  canvas{image-rendering:pixelated;display:block;touch-action:none}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:#1b1626;color:#ffe9b0;
    flex-direction:column;align-items:center;justify-content:center;font:600 20px/1.6 system-ui,sans-serif;text-align:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #rotate i{font-style:normal;font-size:56px;display:block;animation:rot 2.4s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  /* 触屏设备竖屏时提示横屏（桌面窄窗口不提示） */
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
  @media (orientation:portrait) and (max-width:600px){#rotate{display:flex}}
  #boot{position:fixed;inset:0;z-index:5;background:#1b1626;color:#ffe9b0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 22px/1.6 system-ui,sans-serif}
  #boot b{display:block;width:160px;height:6px;margin-top:14px;border-radius:3px;background:#3a2f4a;overflow:hidden;position:relative}
  #boot b::after{content:"";position:absolute;top:0;left:0;height:100%;width:40%;background:#ffd27a;border-radius:3px;animation:bootbar 1.2s ease-in-out infinite}
  @keyframes bootbar{0%{left:-40%}100%{left:100%}}
  #boot i{font-style:normal;font-size:44px;animation:bootbob 1.4s ease-in-out infinite}
  @keyframes bootbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #fatal{display:none;position:fixed;inset:0;z-index:20;background:rgba(27,22,38,.94);color:#ffe9b0;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:600 20px/1.7 system-ui,sans-serif}
  #fatal button{margin-top:18px;padding:14px 32px;min-height:48px;font:600 18px system-ui,sans-serif;border:2px solid #f2d58a;border-radius:10px;background:#2b2230;color:#ffe9b0}
</style>
</head>
<body>
<div id="game"></div>
<div id="boot"><i>🎅</i>圣诞帽帽 加载中…<b></b></div>
<div id="fatal"><div id="fatalMsg">画面出了点问题</div><button id="fatalBtn" type="button">重新加载</button></div>
<noscript><div style="position:fixed;inset:0;z-index:30;background:#1b1626;color:#ffe9b0;display:flex;align-items:center;justify-content:center;font:600 20px system-ui,sans-serif;text-align:center">需要启用 JavaScript 才能玩《圣诞帽帽》。</div></noscript>
<div id="rotate"><i>📱</i>请横屏游玩<br><small style="opacity:.7;font-weight:400">Please rotate your device</small></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
