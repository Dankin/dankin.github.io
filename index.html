。`,rottenApple:`烂苹果`,rottenHint:`一个烂苹果,会坏一筐。点掉它。`,library:`图鉴`},gu={ok:`好`,cancel:`算了`,close:`关上`,back:`回去`,next:`下一个`,skip:`跳过`,continue:`继续`,confirm:`确定`,collect:`收下`,claim:`领取`,open:`拆开`,seeAll:`看全部`,retry:`再试一次`,settings:`设置`,pause:`歇会儿`,resume:`接着摇`,shake:`摇`,share:`分享`,copy:`复制`,copied:`已复制`},_u={title:`图鉴`,pageVarieties:`品种`,pageEggs:`彩蛋`,progress:`已收集 {n}/{total}`,unseenName:`???`,unseenVariety:`还没见过。继续摇。`,unseenEgg:`还没发现。也许,在某个角落。`,newBadge:`新`,discoveredToast:`图鉴 +1:{name}`,allDone:`图鉴满了。树说:你很闲。`,emptyVarieties:`一个都没有。先摇几下。`,emptyEggs:`一个都没发现。别急,它们会等你。`,disclaimerTitle:`声明`,disclaimerBody:`本游戏与苹果公司无关,只和水果有关。`},vu={slot:`空槽。放个道具进去,什么都不做就是浪费。`,stock:`库存是空的。摇一下。`,pile:`果堆里没有苹果。`,orders:`暂时没有订单。有人要货了会通知你。`,shop:`这里暂时没东西。等一个新时代。`,news:`今天没新闻。树说那是好事。`,events:`静悄悄的。静得有点可疑。`,eggsHint:`提示:有些东西,点一点才知道。`,noEggsYet:`还没有彩蛋。可是你已经在找了。`,loading:[`苹果在路上……`,`树在伸懒腰……`,`老徐在找手套……`,`日历在催……`],offlineEmpty:`你不在的时候,树在休息。`},yu={title:`设置`,sound:`音效`,music:`音乐`,vibrate:`震动`,reduceMotion:`减少动效`,reduceMotionHint:`少晃一点,少闪一点。`,textSize:`字号`,textSizeOptions:[`小`,`中`,`大`],newsTicker:`新闻条`,language:`语言`,languageValue:`中文`,exportSave:`导出存档`,importSave:`导入存档`,exportHint:`存一份,换个设备也能接着摇。`,importOk:`读到了。接着摇。`,importFail:`这个文件看不懂。树也看不懂。`,reset:`重新开始`,resetHint:`清空所有进度。回不来。`,version:`版本`,about:`关于`,aboutBody:`一个摇苹果的小游戏。送给一个人。`,credits:`制作:一个人,一棵树,一点耐心。`,disclaimer:`本游戏与苹果公司无关,只和水果有关。`,debugOn:`调试已开`},bu={reset:{title:`真的要重来吗?`,body:`树会记得你,但存档不会。`,ok:`重来`,cancel:`算了`},leaveGift:{title:`先别急着拆`,body:`礼物还没到时间。时间到了,树下会自己多个盒子。`,ok:`好`,cancel:`知道了`},importOverwrite:{title:`覆盖当前进度?`,body:`导入后,现在的存档会被替换。`,ok:`覆盖`,cancel:`算了`},sell:{title:`卖掉它?`,body:`卖掉退回一部分库存。这一个就没了。`,ok:`卖`,cancel:`留着`}},xu={saved:`已存档。`,saveFail:`存档失败。浏览器说空间不够。`,newDay:`新的一天。树换了片叶子。`,tierUp:`升档了:{name}。`,gateUnlock:`新道具:{name}。`,orderDone:`订单完成。`,orderMiss:`订单过期了。没关系。`,rottenCleared:`清掉了一个烂苹果。`,wormHealed:`虫眼治好了。`,pinned:`钉住了。`,unpinned:`取消钉住。`,offered:`献出一批苹果,买东西便宜了。`,poisonDropped:`毒苹果,点掉了。`,eggFound:`发现一个彩蛋:{name}。`,maxed:`到顶了。再多就装不 ale`,`我还会回来的,大概。`,`结局画面,牛顿在树下挥手`]])},{id:`xiaoman`,name:`督察小满`,role:`较真的督察。拿着印章,心里软。最后偷吃一个。`,voice:`公事公办的短句,常带"规范""流程"。越严肃越好笑。偶尔偷尝被抓包后嘴硬。`,firstEra:2,catchphrase:`证件呢?苹果证也行。`,lines:hd(`xiaoman`,[[`intro`,`证件呢?苹果证也行。`,`进入第 3 时代(果山/卡车)首次出现`],[`era`,`这个流程,不符合规范。`,`进入第 3 时代后 30 秒`],[`event`,`这个苹果,不合格。……合格了。`,`牛顿事件被领取后,小满检查那颗苹果`],[`tap`,`别碰印章,会花。`,`玩家点击小满`],[`idle`,`我在巡逻,别管我。`,`果山/卡车时代空闲时`],[`egg`,`我只尝了一口,鉴定用。`,`小满偷吃彩蛋/被牛顿砸中的苹果收买时`],[`milestone`,`数量异常。……异常地多。盖章。`,`送达进度达到 75%`],[`finale`,`最后一个我吃了。算我的。`,`结局画面,小满盖章通过后`]])},{id:`crow`,name:`乌鸦老黑`,role:`乌鸦帮头目。黑帮派头的小偷,偷得很有礼貌。`,voice:`压低声音的"江湖腔",爱说"兄弟们"。从不承认偷,只说"借"。偶尔讲义气。`,firstEra:1,catchphrase:`兄弟们,今晚吃好点。`,lines:hd(`crow`,[[`intro`,`兄弟们,今晚吃好点。`,`进入第 2 时代,乌鸦首次出现`],[`event`,`借一下,下辈子还。`,`小鸟/乌鸦事件出现时`],[`event`,`给你留一个,够意思吧?`,`玩家领取小鸟事件后`],[`tap`,`我是路过的,真的。`,`玩家点击乌鸦`],[`idle`,`今天天气好,适合顺。`,`果园时代 30 秒无操作`],[`era`,`你的果园,我们罩了。`,`进入第 2 时代 60 秒后`],[`egg`,`咳,这是我的业务范围。`,`发现"苹果核""毛毛虫"等小彩蛋时偶尔`],[`finale`,`最后一个我没动,真的。`,`结局画面,乌鸦蹲在盒子旁`]])},{id:`laohai`,name:`老海`,role:`海关员。爱数数,总数错,数着数着睡着。`,voice:`数数口头禅,"一、二……"中途断掉。一本正经但迷糊。`,firstEra:3,catchphrase:`一、二……刚才数到几了?`,lines:hd(`laohai`,[[`intro`,`一、二……刚才数到几了?`,`进入第 4 时代(果城/货船)首次出现`],[`idle`,`呼……啊?我没睡。`,`果城/货船时代 30 秒无操作`],[`era`,`海关例行检查:你这是苹果。`,`进入第 4 时代后 30 秒`],[`buy`,`货船的苹果,数目对得上……大概。`,`购买货船单位时`],[`tap`,`别说话,我数着呢。`,`玩家点击老海`],[`milestone`,`三、四……不对,从头来。`,`送达进度达到 25%/50%`],[`egg`,`每个都要登记,我的小本子呢?`,`发现彩蛋时偶尔`],[`finale`,`一共多少我不知道,但都是真的。`,`结局画面`]])},{id:`dudu`,name:`嘟嘟`,role:`外星人。说话全是感叹号,把苹果当货币。`,voice:`全部短句加感叹号,偶尔只有"嘟嘟!"。夸张的喜爱。语法一知半解。`,firstEra:4,catchphrase:`地球货币!好吃!`,lines:hd(`dudu`,[[`intro`,`地球货币!好吃!`,`进入第 5 时代(果星/飞机)首次出现`],[`era`,`航线!开通!`,`进入第 5 时代后 30 秒`],[`idle`,`嘟嘟!嘟嘟嘟!`,`果星/飞机时代 30 秒无操作`],[`tap`,`这个红色圆圆!再来!`,`玩家点击嘟嘟`],[`buy`,`我们不要金子!要苹果!`,`购买飞机单位时`],[`event`,`你们的星球,好香!`,`流星事件出现时`],[`milestone`,`老徐!你是首领吗?!`,`送达进度达到 75%`],[`egg`,`太好吃了!别送了!再送!`,`发现彩蛋时偶尔`],[`finale`,`下次!带橘子!不要!`,`结局画面,嘟嘟挥手`]])},{id:`doorman`,name:`门童`,role:`苹果之门的守门人。一板一眼,其实是在关心你。`,voice:`礼貌、正式、一字一顿。用"请"和"您"。拒绝时也像在鞠躬。`,firstEra:5,catchph <div id="news" role="status" aria-live="off" aria-label="苹果日报"><span id="newsMast">苹果日报</span><div id="newsView"><span id="newsText"></span></div></div>

<main id="scene"><canvas id="stage" aria-label="苹果传送线"></canvas><div id="toast" role="status" aria-live="polite"></div><button id="btnHelper" type="button" hidden></button></main>

<footer id="bar">
  <section class="side" id="srcSide" aria-label="生产线">
    <button id="btnSrcBuy" class="act" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
    <button id="btnSrcUp" class="act up" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
  </section>
  <section class="side" id="rtSide" aria-label="运输线">
    <button id="btnRtBuy" class="act" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
    <button id="btnRtUp" class="act up" type="button"><b class="nm"></b><span class="pv"></span><span class="pr"></span><i class="fx"></i></button>
  </section>
</footer>

<div id="gates" hidden aria-hidden="true">
  <button class="slot" id="gate0" type="button" tabindex="-1"><b class="nm">+</b></button>
  <button class="slot" id="gate1" type="button" tabindex="-1"><b class="nm">+</b></button>
  <button class="slot" id="gate2" type="button" tabindex="-1"><b class="nm">+</b></button>
</div>

<div id="gatePick" hidden role="dialog" aria-label="选择关卡">
  <div class="gp-head"><b id="gatePickTitle">选择关卡</b><button id="gatePickClose" class="ib sm" type="button" aria-label="关闭">✕</button></div>
  <div id="gateOpts" class="opts"></div>
</div>

<div id="branchPick" hidden role="dialog" aria-label="选择分支">
  <div class="bp-box">
    <div class="bp-head"><b id="branchTitle">升级</b><span id="branchSub"></span></div>
    <div class="bp-cards">
      <button id="branch0" class="bcard" type="button" data-branch="0"><b class="nm"></b><span class="desc"></span><span class="pr"></span></button>
      <button id="branch1" class="bcard" type="button" data-branch="1"><b class="nm"></b><span class="desc"></span><span class="pr"></span></button>
    </div>
    <button id="branchCancel" class="plain" type="button">再想想</button>
  </div>
</div>

<div id="settings" hidden role="dialog" aria-label="设置">
  <div class="sheet">
    <h2>设置</h2>
    <div class="btns">
      <button id="btnTheme" type="button">主题:自动</button>
      <button id="btnSound" type="button">声音</button>
      <button id="btnMotion" type="button" hidden>摇一摇:关</button>
      <button id="btnExport" type="button">导出存档</button>
      <button id="btnImport" type="button">导入存档</button>
      <button id="btnReset" type="button">重新开始</button>
    </div>
    <p id="soundNote" class="note">静音拨片开着时声音会消失;iPhone 请先关掉侧边静音。</p>
    <p id="installNote" class="note">换手机或清缓存前,先「导出存档」;「添加到主屏幕」后可以像 App 一样打开。</p>
    <div id="exactApples"></div>
    <div id="saveWarn"></div>
    <div id="debug"></div>
    <div class="foot">原创小游戏,与苹果公司无关。</div>
    <button class="close" id="btnCloseSettings" type="button">关闭</button>
  </div>
</div>

<script>
// 仅处理:设置抽屉开关、关卡/分支弹层的关闭(点空白/Esc)。不依赖 main.ts。
(function(){
  var $=function(i){return document.getElementById(i)};
  var s=$('settings'),gp=$('gatePick'),bp=$('branchPick');
  function closeAll(){s.hidden=true;gp.hidden=true;bp.hidden=true}
  $('btnCloseSettings').addEventListener('click',function(){s.hidden=true});
  $('gatePickClose').addEventListener('click',function(){gp.hidden=true});
  $('branchCancel').addEventListener('click',function(){bp.hidden=true});
  s.addEventListener('pointerdown',function(e){if(e.target===s)s.hidden=true});
  bp.addEventListener('pointerdown',function(e){if(e.target===bp)bp.hidden=true});
  document.addEventListener('pointerdown',function(e){
    if(gp.hidden||gp.contains(e.target)||e.target.closest&&e.target.closest('.slot'))return;
    gp.hidden=true;
  },true);
  addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
})();
</script>
</body>
</html>
